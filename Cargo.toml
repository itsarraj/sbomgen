[package]
name = "sbomgen"
version = "0.1.0"
edition = "2021"
description = "Generates a CycloneDX 1.5 JSON SBOM from a Cargo.lock, package-lock.json, or requirements.txt"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/sbomgen"
readme = "README.md"
keywords = ["sbom", "cyclonedx", "cargo", "npm", "security"]
categories = ["command-line-utilities"]

[lib]
name = "sbomgen"
path = "src/lib.rs"

[[bin]]
name = "sbomgen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
